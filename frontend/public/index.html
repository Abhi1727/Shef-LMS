<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3d4a" />
    
    <!-- Enhanced Cache Control Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Security and Performance Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Preconnect and Prefetch for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="//api.skystates.com" />
    <link rel="dns-prefetch" href="//cdn.skystates.com" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Sky States LMS - Professional Learning Management System for Cyber Security & Ethical Hacking courses. Advance your career with expert-led training." />
    <meta name="keywords" content="Sky States LMS, Learning Management System, Cyber Security, Ethical Hacking, Online Learning, IT Training, Security Courses" />
    <meta name="author" content="Sky States LMS" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skystates.com/" />
    <meta property="og:title" content="Sky States LMS" />
    <meta property="og:description" content="Professional Learning Management System for Cyber Security & Ethical Hacking courses. Advance your career with expert-led training." />
    <meta property="og:site_name" content="Sky States LMS" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://skystates.com/" />
    <meta name="twitter:title" content="Sky States LMS" />
    <meta name="twitter:description" content="Professional Learning Management System for Cyber Security & Ethical Hacking courses." />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://skystates.com/" />
    
    <title>Sky States LMS | Learning Management System</title>
    
    <!-- Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Sky States LMS",
      "url": "https://skystates.com",
      "description": "Professional Learning Management System for Cyber Security & Ethical Hacking courses",
      "sameAs": [
        "https://skystates.com"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "English"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
