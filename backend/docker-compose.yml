# Shef-LMS Backend — production. Default data store is Mongo.
# Firestore only when USE_FIRESTORE=true in .env (after approved cutover).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shef-lms-backend
    # ports omitted - network_mode: host binds app directly to host :5000
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - CONTENT_ROOT=/app/content
      - USE_FIRESTORE=${USE_FIRESTORE:-true}
      - FIRESTORE_PROJECT=${FIRESTORE_PROJECT:-skystateslms}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-lms-prod}
      - FIRESTORE_IMPERSONATE_SA=${FIRESTORE_IMPERSONATE_SA:-firestore-lms-runtime@skystateslms.iam.gserviceaccount.com}
      - FIRESTORE_OAUTH_QUOTA_PROJECT=${FIRESTORE_OAUTH_QUOTA_PROJECT:-47944521032}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ../content:/app/content:ro
      - ./uploads:/app/uploads
    restart: unless-stopped
    network_mode: host

# Use host network so container shares host's network (Atlas connectivity works)
