# Shef-LMS Dev/Staging Backend — Firestore lms-dev
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shef-lms-backend-dev
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - PORT=5001
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - CONTENT_ROOT=/app/content
      - USE_FIRESTORE=true
      - FIRESTORE_PROJECT=skystateslms
      - FIRESTORE_DATABASE=lms-dev
      - FIRESTORE_IMPERSONATE_SA=firestore-lms-runtime@skystateslms.iam.gserviceaccount.com
      - FIRESTORE_OAUTH_QUOTA_PROJECT=47944521032
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./logs:/app/logs
      - ./.env.dev:/app/.env:ro
      - ../content:/app/content:ro
      - ./uploads:/app/uploads
    restart: unless-stopped
    network_mode: host
